name: Office Power Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: office-power
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: office-power/global.json
      - run: dotnet test tests/OfficePower.Tests/OfficePower.Tests.csproj -c Release --nologo
      - run: dotnet build OfficePower.sln -c Release --nologo
      - run: ./scripts/Publish-Windows.ps1
      - name: WinForms UI and DPAPI smoke test
        run: |
          $exe = Join-Path $PWD 'artifacts\OfficePower-win-x64\Controller\OfficePower.Controller.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'WinForms smoke test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'WinForms UI / DPAPI smoke test failed.' }
      - name: Validate installer and private-key ACLs on Windows
        run: ./scripts/Test-Installation.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OfficePower-win-x64
          path: office-power/artifacts/OfficePower-win-x64.zip
